name: Update major tag

# Move v1 to the latest v1.x.y when a release is published,
# so that `uses: k-s0ma/github-profile-widgets@v1` gets the latest compatible version.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "skip: $TAG is not vX.Y.Z"; exit 0; }
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"

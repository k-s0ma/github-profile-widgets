<svg xmlns="http://www.w3.org/2000/svg" width="480" height="32" viewBox="0 0 480 32">
  <style>
    @font-face { font-family: "Widgets Sans"; font-weight: 100 900; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Widgets Sans", "DIN Next", "DIN Pro", "DIN 2014", Bahnschrift, "Noto Sans JP", "Noto Sans", sans-serif; }
    .key { fill: #1f2328; } .sub { fill: #8c959f; }
    .key-s { stroke: #1f2328; fill: none; } .sub-s { stroke: #8c959f; fill: none; }
    .name { font-size: 26px; font-weight: 400; letter-spacing: 0.04em; }
    .num { font-size: 28px; font-weight: 300; }
    .label { font-size: 11px; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .key { fill: #e6edf3; } .sub { fill: #6e7681; }
      .key-s { stroke: #e6edf3; } .sub-s { stroke: #6e7681; }
    }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="4" width="314.9" height="1.5" class="key" opacity="1" style="animation: grow 694.2148760330579ms cubic-bezier(.2,.7,.2,1) 0ms both; transform-box: fill-box; transform-origin: left center;"/>
  <rect x="316.9" y="4" width="161.1" height="1.5" class="key" opacity="0.8" style="animation: grow 405.78512396694214ms cubic-bezier(.2,.7,.2,1) 594ms both; transform-box: fill-box; transform-origin: left center;"/>
  <text x="0" y="26" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 700ms both;">JavaScript 66%   ·   CSS 34%</text>
</svg>
